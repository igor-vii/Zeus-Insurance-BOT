## Render Blueprint — Zeus Insurance BOT (Frontend ONLY)
## Docs: https://render.com/docs/blueprint-spec
##
## Архитектура:
##   - Frontend  → Render (Static Site)
##   - API       → Railway
##   - PostgreSQL → Railway
##   - Watchers  → Railway
##
## Deploy steps:
##   1. Push this file to GitHub
##   2. Go to render.com → New → Blueprint → connect your repo
##   3. Render creates ONLY the frontend static site
##   4. After first deploy, fill VITE_API_BASE_URL with your Railway API URL

services:

  # ── Frontend — Static Site ───────────────────────────────────────────────
  - type: static
    name: Zeus-Insurance-BOT
    region: oregon
    buildCommand: >
      npm install -g pnpm@10.28.0 &&
      pnpm install --no-frozen-lockfile --prefer-offline &&
      pnpm --filter @zeus/sdk build &&
      cd frontend && pnpm build
    staticPublishPath: frontend/dist
    # SPA routing — all paths fall back to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - frontend/**
        - sdk/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_VERSION
        value: "20"
      # After first deploy copy the Railway API URL here and redeploy:
      #   https://<your-api>.up.railway.app/api
      - key: VITE_API_BASE_URL
        value: ""             # ← fill with https://<your-api>.up.railway.app/api
      - key: VITE_WATCHER_API_URL
        value: ""             # ← fill with https://<your-watcher>.up.railway.app (optional)
