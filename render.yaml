## Render Blueprint — Zeus Insurance (3 services + DB)
## Docs: https://render.com/docs/blueprint-spec
##
## Deploy steps:
##   1. Push this file to GitHub
##   2. Go to render.com → New → Blueprint → connect your repo
##   3. Render reads this file and creates all services automatically
##   4. After first deploy, fill in the CORS_ORIGINS and VITE_API_BASE_URL
##      values (see comments) and redeploy
##   5. Set all secrets marked "sync: false" in the Render dashboard

services:

  # ── 1. Frontend — Static Site ────────────────────────────────────────────
  - type: static
    name: zeus-frontend
    region: oregon
    buildCommand: >
      npm install -g pnpm@10.28.0 &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @zeus/sdk build &&
      cd frontend && pnpm build
    staticPublishPath: ./frontend/dist/public
    # SPA routing — all paths fall back to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - frontend/**
        - sdk/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_VERSION
        value: "20"
      # After first deploy copy the zeus-insurance-api URL here and redeploy:
      #   https://zeus-insurance-api.onrender.com/api
      - key: VITE_API_BASE_URL
        value: ""             # ← fill with https://<your-api>.onrender.com/api
      - key: VITE_WATCHER_API_URL
        value: ""             # ← fill with https://<your-watcher>.onrender.com  (optional)

  # ── 2. API Server — Web Service ──────────────────────────────────────────
  - type: web
    name: zeus-insurance-api
    runtime: node
    region: oregon
    plan: free               # upgrade to starter ($7/mo) for always-on + custom domain
    rootDir: .
    buildCommand: >
      npm install -g pnpm@10.28.0 &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @zeus/sdk build &&
      pnpm --filter @workspace/api-server build
    startCommand: node --enable-source-maps ./api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    buildFilter:
      paths:
        - api-server/**
        - sdk/**
        - lib/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"       # Render injects PORT automatically; keep in sync
      - key: NODE_ENV
        value: production

      # ── Network ───────────────────────────────────────────────────────────
      - key: ZEUS_NETWORK
        value: base-sepolia
      - key: ZEUS_INSURANCE_NETWORK
        value: base-sepolia

      # ── Base Sepolia contracts ─────────────────────────────────────────────
      - key: ZEUS_INSURANCE_ADDRESS
        value: "0x58038Df01A824C94F3D2fEd6d4e1bEf2211Ad8F4"
      - key: ZEUS_ESCROW_BOT_ADDRESS
        value: "0x87365462353bCBAB2CF0DF57c7Cb15519C5B7c76"
      - key: BASE_SEPOLIA_RPC_URL
        value: "https://sepolia.base.org"

      # ── X Layer Mainnet contracts ──────────────────────────────────────────
      - key: ZEUS_INSURANCE_ADDRESS_XLAYER
        value: "0x8D10C2c6C92b613C1938fe532f0e391044e76188"
      - key: ZEUS_ESCROW_ADDRESS_XLAYER
        value: "0x0d4AD4C6b60F445d0e478E0AF48075340AC51Cf5"
      - key: ZEUS_ESCROW_BOT_ADDRESS_XLAYER
        value: "0x0d4AD4C6b60F445d0e478E0AF48075340AC51Cf5"
      - key: ZEUS_RESERVE_ADDRESS_XLAYER
        value: "0xadED902c2C6dD7D1B5b72A6a0A3358a9b9d4A79c"
      - key: XLAYER_MAINNET_RPC_URL
        value: "https://rpc.xlayer.tech"

      # ── Database (auto-injected by Render from the DB below) ──────────────
      - key: DATABASE_URL
        fromDatabase:
          name: zeus-insurance-db
          property: connectionString

      # ── CORS — add your frontend URL after first deploy ───────────────────
      # Example: https://zeus-frontend.onrender.com
      - key: CORS_ORIGINS
        value: ""             # ← fill after first deploy

      # ── Secrets — set in Render dashboard, never commit ───────────────────
      - key: SESSION_SECRET
        sync: false
      - key: SERVER_PRIVATE_KEY
        sync: false           # enables automatic mode (optional)
      - key: OKLINK_API_KEY
        sync: false

  # ── 3. Watcher — Background Worker ──────────────────────────────────────
  - type: worker
    name: zeus-watcher
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: >
      npm install -g pnpm@10.28.0 &&
      pnpm install --no-frozen-lockfile
    startCommand: node --import tsx/esm ./watcher/src/index.ts
    buildFilter:
      paths:
        - watcher/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Point to the API server deployed above
      - key: API_SERVER_URL
        value: "https://zeus-insurance-api.onrender.com"
      - key: BASE_SEPOLIA_RPC_URL
        value: "https://sepolia.base.org"
      - key: ZEUS_INSURANCE_ADDRESS
        value: "0x58038Df01A824C94F3D2fEd6d4e1bEf2211Ad8F4"
      - key: POLL_INTERVAL_MS
        value: "15000"
      - key: MAX_POLICY_SCAN
        value: "200"
      - key: WATCHER_INDEX
        value: "0"
      # ── Secret ────────────────────────────────────────────────────────────
      - key: WATCHER_PRIVATE_KEY
        sync: false           # registered watcher address key; set in Render dashboard

# ── PostgreSQL ──────────────────────────────────────────────────────────────
databases:
  - name: zeus-insurance-db
    databaseName: zeus_insurance
    user: zeus_user
    plan: free               # 1 GB; upgrade to starter for persistence SLA
    region: oregon
